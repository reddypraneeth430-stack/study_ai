<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Generate 2-mark, 5-mark, and 10-mark exam questions from your study materials using Ollama AI." />
  <title>Exam Prep — StudyMate AI</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-brand"><div class="brand-icon">🎓</div><span class="brand-name">StudyMate <span>AI</span></span></div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Main</div>
      <a href="/dashboard.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Dashboard</a>
      <a href="/upload.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>My Materials</a>
      <div class="nav-section-label" style="margin-top:8px;">AI Tools</div>
      <a href="/chat.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>Ask Notes</a>
      <a href="/quiz.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>Quiz</a>
      <a href="/exam.html" class="nav-item active"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>Exam Prep</a>
      <a href="/planner.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Study Planner</a>
    </nav>
    <div class="sidebar-footer"><a href="/index.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Home</a></div>
  </aside>

  <div class="main-content">
    <header class="top-header">
      <div><div class="header-title">Exam Preparation</div><div class="header-subtitle">Generate 2, 5, and 10 mark questions for your exam</div></div>
      <div class="header-actions">
        <button class="btn btn-ghost btn-sm" onclick="window.print()" id="print-btn" style="display:none;">🖨️ Print</button>
      </div>
    </header>

    <div class="page-content animate-fadeIn">

      <!-- Setup -->
      <div id="exam-setup" class="card" style="max-width:560px;margin:0 auto;">
        <div class="card-title mb-4">📋 Generate Exam Questions</div>

        <div class="form-group">
          <label class="form-label">Select Document</label>
          <select class="form-select" id="exam-doc-select">
            <option value="">— Loading… —</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Mark Types to Generate</label>
          <div class="flex gap-3">
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
              <input type="checkbox" id="mark-2" value="2" checked style="accent-color:var(--accent-primary);">
              <span>2-Mark</span>
            </label>
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
              <input type="checkbox" id="mark-5" value="5" checked style="accent-color:var(--accent-primary);">
              <span>5-Mark</span>
            </label>
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
              <input type="checkbox" id="mark-10" value="10" checked style="accent-color:var(--accent-primary);">
              <span>10-Mark</span>
            </label>
          </div>
        </div>

        <button class="btn btn-primary w-full" id="generate-exam-btn" onclick="generateExam()">
          📋 Generate Questions
        </button>
      </div>

      <!-- Results -->
      <div id="exam-results" style="display:none;"></div>

    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
  async function loadDocs() {
    try {
      const data = await apiFetch('/documents');
      const sel = document.getElementById('exam-doc-select');
      sel.innerHTML = '<option value="">— Select Document —</option>';
      (data.documents || []).forEach(d => {
        const opt = document.createElement('option');
        opt.value = d.id;
        opt.textContent = d.original_filename;
        sel.appendChild(opt);
      });
    } catch (err) { showToast('Could not load documents', 'error'); }
  }

  async function generateExam() {
    const docId = document.getElementById('exam-doc-select').value;
    if (!docId) { showToast('Select a document first.', 'warning'); return; }

    const markTypes = ['2','5','10'].filter(m => document.getElementById(`mark-${m}`).checked);
    if (!markTypes.length) { showToast('Select at least one mark type.', 'warning'); return; }

    const btn = document.getElementById('generate-exam-btn');
    setLoading(btn, true, 'Generating questions…');

    try {
      const data = await apiFetch('/exam/generate', {
        method: 'POST',
        body: { document_id: docId, mark_types: markTypes },
      });
      renderExamResults(data);
      document.getElementById('print-btn').style.display = 'flex';
    } catch (err) {
      showToast('Error: ' + err.message, 'error');
    } finally {
      setLoading(btn, false);
    }
  }

  function renderExamResults(data) {
    document.getElementById('exam-setup').style.display = 'none';
    const panel = document.getElementById('exam-results');
    panel.style.display = 'block';

    const markColors = { '2': 'indigo', '5': 'teal', '10': 'amber' };
    const markLabels = { '2': '2-Mark Questions (Short Answer)', '5': '5-Mark Questions (Medium Answer)', '10': '10-Mark Questions (Long Answer)' };

    let html = `
      <div class="flex justify-between items-center mb-4">
        <div>
          <div class="card-title">${data.title}</div>
          <div class="text-muted text-sm">Generated exam questions</div>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="resetExam()">← New Set</button>
      </div>`;

    Object.entries(data.questions).forEach(([mark, questions]) => {
      html += `
        <div class="card mb-6">
          <div class="flex items-center gap-3 mb-4">
            <span class="badge badge-${markColors[mark] || 'indigo'}" style="font-size:0.8rem;padding:4px 12px;">${mark} Mark</span>
            <div class="card-title">${markLabels[mark] || mark + '-Mark Questions'}</div>
          </div>
          ${questions.map((q, i) => `
            <div style="margin-bottom:24px;padding-bottom:24px;border-bottom:1px solid var(--border-subtle);">
              <div class="font-semibold mb-2">Q${i + 1}. ${q.question}</div>
              <div style="margin-top:10px;padding:14px;background:var(--bg-tertiary);border-radius:var(--radius-md);border-left:3px solid var(--accent-${markColors[mark] || 'primary'});">
                <div class="text-xs text-muted mb-1 font-semibold">MODEL ANSWER</div>
                <div style="color:var(--text-secondary);line-height:1.7;font-size:0.875rem;">${q.sample_answer}</div>
              </div>
            </div>`).join('')}
        </div>`;
    });

    panel.innerHTML = html;
  }

  function resetExam() {
    document.getElementById('exam-setup').style.display = 'block';
    document.getElementById('exam-results').style.display = 'none';
    document.getElementById('print-btn').style.display = 'none';
  }

  document.addEventListener('DOMContentLoaded', loadDocs);
</script>
</body>
</html>
