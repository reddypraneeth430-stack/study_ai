<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Generate AI-powered MCQ quizzes from your study materials. Test your knowledge with Easy, Medium, or Hard questions." />
  <title>Quiz — StudyMate AI</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-brand"><div class="brand-icon">🎓</div><span class="brand-name">StudyMate <span>AI</span></span></div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Main</div>
      <a href="/dashboard.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Dashboard</a>
      <a href="/upload.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>My Materials</a>
      <div class="nav-section-label" style="margin-top:8px;">AI Tools</div>
      <a href="/chat.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>Ask Notes</a>
      <a href="/quiz.html" class="nav-item active"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>Quiz</a>
      <a href="/exam.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>Exam Prep</a>
      <a href="/planner.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Study Planner</a>
    </nav>
    <div class="sidebar-footer"><a href="/index.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Home</a></div>
  </aside>

  <div class="main-content">
    <header class="top-header">
      <div><div class="header-title">Quiz</div><div class="header-subtitle">Test your knowledge with AI-generated questions</div></div>
    </header>

    <div class="page-content animate-fadeIn">

      <!-- Setup Panel -->
      <div id="setup-panel">
        <div class="card" style="max-width:560px;margin:0 auto;">
          <div class="card-title mb-4">🧪 Generate a Quiz</div>

          <div class="form-group">
            <label class="form-label">Select Document</label>
            <select class="form-select" id="quiz-doc-select">
              <option value="">— Loading documents… —</option>
            </select>
          </div>

          <div class="grid-2">
            <div class="form-group">
              <label class="form-label">Number of Questions</label>
              <select class="form-select" id="quiz-num">
                <option value="5">5 Questions</option>
                <option value="10" selected>10 Questions</option>
                <option value="15">15 Questions</option>
                <option value="20">20 Questions</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Difficulty</label>
              <select class="form-select" id="quiz-difficulty">
                <option value="easy">Easy</option>
                <option value="medium" selected>Medium</option>
                <option value="hard">Hard</option>
              </select>
            </div>
          </div>

          <button class="btn btn-primary w-full" id="generate-quiz-btn" onclick="generateQuiz()">
            🎯 Generate Quiz
          </button>
        </div>
      </div>

      <!-- Quiz in progress -->
      <div id="quiz-panel" class="hidden" style="display:none;">
        <div class="flex justify-between items-center mb-4">
          <div>
            <div class="card-title" id="quiz-title">Quiz</div>
            <div class="text-sm text-muted" id="quiz-progress">Question 0 of 0</div>
          </div>
          <button class="btn btn-ghost btn-sm" onclick="resetQuiz()">✕ Cancel</button>
        </div>
        <div id="quiz-questions-container"></div>
        <div class="flex justify-between items-center mt-6">
          <div class="text-muted text-sm" id="answered-count">0 answered</div>
          <button class="btn btn-primary" id="submit-quiz-btn" onclick="submitQuiz()">Submit Answers →</button>
        </div>
      </div>

      <!-- Results panel -->
      <div id="results-panel" class="hidden" style="display:none;"></div>

    </div>
  </div>
</div>
<script src="/js/app.js"></script>
<script src="/js/quiz.js"></script>
</body>
</html>
