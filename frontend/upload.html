<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Upload your study materials — PDF, DOCX, or TXT. StudyMate AI extracts text for AI-powered summaries, Q&A, and quizzes." />
  <title>My Materials — StudyMate AI</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="app-layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">🎓</div>
      <span class="brand-name">StudyMate <span>AI</span></span>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Main</div>
      <a href="/dashboard.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a href="/upload.html" class="nav-item active">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        My Materials
      </a>
      <div class="nav-section-label" style="margin-top:8px;">AI Tools</div>
      <a href="/chat.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        Ask Notes
      </a>
      <a href="/quiz.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        Quiz
      </a>
      <a href="/exam.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
        Exam Prep
      </a>
      <a href="/planner.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Study Planner
      </a>
    </nav>
    <div class="sidebar-footer">
      <a href="/index.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Home
      </a>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="main-content">
    <header class="top-header">
      <div>
        <div class="header-title">My Materials</div>
        <div class="header-subtitle">Upload and manage your study documents</div>
      </div>
    </header>

    <div class="page-content animate-fadeIn">

      <!-- Upload Zone -->
      <div class="card mb-6">
        <div class="card-title mb-4">Upload Study Material</div>

        <div class="upload-zone" id="upload-zone">
          <input type="file" id="file-input" accept=".pdf,.docx,.txt" style="position:absolute;inset:0;opacity:0;cursor:pointer;" />
          <div class="upload-icon">📤</div>
          <div class="upload-title">Drag & drop your file here</div>
          <div class="upload-subtitle">Supports PDF, DOCX, TXT &nbsp;·&nbsp; Max 20 MB</div>
        </div>

        <!-- Selected file preview -->
        <div id="file-preview" class="hidden" style="margin-top:16px;">
          <div class="flex items-center gap-3" style="padding:12px 16px;background:var(--bg-tertiary);border-radius:var(--radius-md);border:1px solid var(--border-light);">
            <span id="file-icon" style="font-size:1.5rem;">📄</span>
            <div style="flex:1;">
              <div class="font-semibold text-sm" id="file-name">—</div>
              <div class="text-xs text-muted" id="file-size">—</div>
            </div>
            <button class="btn btn-danger btn-sm" onclick="clearFile()">✕ Remove</button>
          </div>
          <button class="btn btn-primary mt-4 w-full" id="upload-btn" onclick="uploadFile()">
            📤 Upload &amp; Process
          </button>
        </div>
      </div>

      <!-- Documents List -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">All Documents</div>
          <button class="btn btn-ghost btn-sm" onclick="loadDocuments()">↻ Refresh</button>
        </div>
        <div id="documents-list">
          <div class="loading-overlay"><div class="spinner"></div> <span>Loading…</span></div>
        </div>
      </div>

      <!-- Summary Modal -->
      <div id="summary-modal" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;">
        <div class="card" style="max-width:680px;width:100%;max-height:80vh;overflow-y:auto;position:relative;">
          <div class="card-header mb-4">
            <div class="card-title" id="summary-modal-title">Document Summary</div>
            <button class="btn btn-ghost btn-sm" onclick="closeSummaryModal()">✕</button>
          </div>
          <div id="summary-modal-content"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
  let selectedFile = null;

  // Drag & drop
  const zone = document.getElementById('upload-zone');
  const fileInput = document.getElementById('file-input');

  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
  zone.addEventListener('drop', e => {
    e.preventDefault();
    zone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file) selectFile(file);
  });

  fileInput.addEventListener('change', e => {
    if (e.target.files[0]) selectFile(e.target.files[0]);
  });

  function selectFile(file) {
    const ext = file.name.split('.').pop().toLowerCase();
    const allowed = ['pdf', 'docx', 'txt'];
    if (!allowed.includes(ext)) {
      showToast(`Unsupported file type ".${ext}". Use PDF, DOCX, or TXT.`, 'error');
      return;
    }
    if (file.size > 20 * 1024 * 1024) {
      showToast('File is too large. Maximum size is 20 MB.', 'error');
      return;
    }
    selectedFile = file;
    const icons = { pdf: '📕', docx: '📘', txt: '📄' };
    document.getElementById('file-icon').textContent = icons[ext] || '📄';
    document.getElementById('file-name').textContent = file.name;
    document.getElementById('file-size').textContent = formatBytes(file.size);
    document.getElementById('file-preview').classList.remove('hidden');
    document.getElementById('file-preview').style.display = 'block';
  }

  function clearFile() {
    selectedFile = null;
    fileInput.value = '';
    document.getElementById('file-preview').style.display = 'none';
    document.getElementById('file-preview').classList.add('hidden');
  }

  async function uploadFile() {
    if (!selectedFile) return;
    const btn = document.getElementById('upload-btn');
    setLoading(btn, true, 'Processing…');

    const formData = new FormData();
    formData.append('file', selectedFile);

    try {
      const data = await apiFetch('/documents/upload', { method: 'POST', body: formData });
      showToast(`✅ "${data.document.original_filename}" uploaded successfully! Generating analysis…`, 'success');
      clearFile();
      await loadDocuments();
      generateSummary(data.document.id, data.document.original_filename);
    } catch (err) {
      console.error('Upload failed:', err);
      let errMsg = err.message;
      if (err.isNetworkError) {
        errMsg = `Cannot reach backend on port 8000. Please start the server: uvicorn backend.main:app --reload --host 127.0.0.1 --port 8000`;
      } else if (err.status === 400 || err.status === 422) {
        errMsg = `Invalid Document: ${err.message}`;
      } else if (err.status === 413) {
        errMsg = `File Too Large: ${err.message}`;
      } else if (err.status === 500) {
        errMsg = `Internal Server Error: ${err.message}`;
      }
      showToast(errMsg, 'error', 6000);
    } finally {
      setLoading(btn, false);
    }
  }

  async function loadDocuments() {
    showLoadingOverlay('documents-list', 'Loading documents…');
    try {
      const data = await apiFetch('/documents');
      renderDocuments(data.documents);
    } catch (err) {
      document.getElementById('documents-list').innerHTML =
        `<div class="text-muted text-sm" style="padding:16px;">Error: ${err.message}</div>`;
    }
  }

  function renderDocuments(docs) {
    const el = document.getElementById('documents-list');
    if (!docs || docs.length === 0) {
      el.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">📂</div>
          <div class="empty-title">No documents yet</div>
          <div class="empty-subtitle">Upload your first study material above</div>
        </div>`;
      return;
    }

    el.innerHTML = `
      <div class="table-wrapper">
        <table>
          <thead>
            <tr><th>File</th><th>Type</th><th>Size</th><th>Words</th><th>Date</th><th>Actions</th></tr>
          </thead>
          <tbody>
            ${docs.map(d => `
              <tr>
                <td>
                  <div class="flex items-center gap-2">
                    <span>${fileTypeIcon(d.file_type)}</span>
                    <span class="font-semibold">${d.original_filename}</span>
                  </div>
                </td>
                <td><span class="badge badge-indigo">${d.file_type.toUpperCase()}</span></td>
                <td class="text-muted">${formatBytes(d.file_size)}</td>
                <td class="text-muted">${d.word_count ? d.word_count.toLocaleString() : '—'}</td>
                <td class="text-muted">${formatDate(d.created_at)}</td>
                <td>
                  <div class="flex gap-2">
                    <button class="btn btn-ghost btn-sm" onclick="generateSummary('${d.id}', '${d.original_filename.replace(/'/g, "\\'")}')">
                      📝 Summary
                    </button>
                    <a href="/chat.html?doc=${d.id}" class="btn btn-ghost btn-sm">💬 Chat</a>
                    <a href="/quiz.html?doc=${d.id}" class="btn btn-ghost btn-sm">🧪 Quiz</a>
                  </div>
                </td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
  }

  async function generateSummary(docId, docName) {
    const modal = document.getElementById('summary-modal');
    const title = document.getElementById('summary-modal-title');
    const content = document.getElementById('summary-modal-content');

    modal.style.display = 'flex';
    modal.classList.remove('hidden');
    title.textContent = `Summary: ${docName}`;
    content.innerHTML = `<div class="loading-overlay"><div class="spinner" style="width:32px;height:32px;border-width:3px;"></div><span>Generating summary…</span></div>`;

    try {
      const data = await apiFetch(`/documents/${docId}/summary`, { method: 'POST' });
      content.innerHTML = `
        <div class="mb-4">
          <div class="font-semibold mb-2" style="color:var(--accent-primary);">⚡ Quick Summary</div>
          <p style="line-height:1.7;color:var(--text-secondary);">${data.quick_summary}</p>
        </div>
        <div class="mb-4">
          <div class="font-semibold mb-2" style="color:var(--accent-teal);">📖 Detailed Summary</div>
          <p style="line-height:1.7;color:var(--text-secondary);">${data.detailed_summary}</p>
        </div>
        ${data.key_points && data.key_points.length ? `
          <div>
            <div class="font-semibold mb-2" style="color:var(--accent-amber);">🔑 Key Points</div>
            <ul style="list-style:none;display:flex;flex-direction:column;gap:8px;">
              ${data.key_points.map(p => `
                <li style="display:flex;gap:8px;align-items:flex-start;">
                  <span style="color:var(--accent-primary);margin-top:3px;">▸</span>
                  <span style="color:var(--text-secondary);line-height:1.6;">${p}</span>
                </li>`).join('')}
            </ul>
          </div>` : ''}`;
    } catch (err) {
      console.error('Summary generation failed:', err);
      let heading = 'Summary Failed';
      let details = err.message;
      if (err.isNetworkError) {
        heading = 'Connection Error';
        details = 'Could not communicate with the backend. Ensure FastAPI is running on port 8000.';
      } else if (err.status === 503) {
        heading = 'AI Service Unavailable';
        details = `Ollama or the model 'qwen2.5:7b' is not accessible: ${err.message}`;
      } else if (err.status === 502) {
        heading = 'AI Generation Error';
        details = `The AI model failed to produce a valid response: ${err.message}`;
      }
      content.innerHTML = `
        <div style="padding:16px 20px;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.3);border-radius:var(--radius-md);">
          <div style="font-weight:600;color:var(--accent-rose);margin-bottom:6px;display:flex;align-items:center;gap:6px;">
            <span>⚠️</span> <span>${heading}</span>
          </div>
          <div style="color:var(--text-secondary);font-size:0.875rem;line-height:1.6;">${details}</div>
        </div>`;
    }
  }

  function closeSummaryModal() {
    const modal = document.getElementById('summary-modal');
    modal.style.display = 'none';
    modal.classList.add('hidden');
  }

  document.addEventListener('DOMContentLoaded', loadDocuments);
</script>
</body>
</html>
