<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Create a personalized AI study plan. Enter your subjects, topics, and exam date to get a structured day-by-day schedule." />
  <title>Study Planner — StudyMate AI</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-brand"><div class="brand-icon">🎓</div><span class="brand-name">StudyMate <span>AI</span></span></div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Main</div>
      <a href="/dashboard.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Dashboard</a>
      <a href="/upload.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>My Materials</a>
      <div class="nav-section-label" style="margin-top:8px;">AI Tools</div>
      <a href="/chat.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>Ask Notes</a>
      <a href="/quiz.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>Quiz</a>
      <a href="/exam.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>Exam Prep</a>
      <a href="/planner.html" class="nav-item active"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Study Planner</a>
    </nav>
    <div class="sidebar-footer"><a href="/index.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Home</a></div>
  </aside>

  <div class="main-content">
    <header class="top-header">
      <div><div class="header-title">Study Planner</div><div class="header-subtitle">Create a personalized AI study schedule</div></div>
    </header>

    <div class="page-content animate-fadeIn">

      <!-- Input Form -->
      <div id="planner-form" class="card" style="max-width:640px;margin:0 auto;">
        <div class="card-title mb-4">📅 Generate Study Plan</div>

        <div class="form-group">
          <label class="form-label">Subjects (comma-separated)</label>
          <input type="text" class="form-input" id="subjects-input" placeholder="e.g., Mathematics, Physics, Chemistry" />
        </div>

        <div class="form-group">
          <label class="form-label">Topics to Cover (comma-separated)</label>
          <textarea class="form-textarea" id="topics-input" style="min-height:80px;"
            placeholder="e.g., Integration, Thermodynamics, Organic Chemistry, Calculus"></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Exam Date</label>
          <input type="date" class="form-input" id="exam-date" />
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label class="form-label">Study Hours per Day</label>
            <select class="form-select" id="hours-per-day">
              <option value="2">2 hours</option>
              <option value="3">3 hours</option>
              <option value="4" selected>4 hours</option>
              <option value="5">5 hours</option>
              <option value="6">6 hours</option>
              <option value="8">8 hours</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Session Duration</label>
            <select class="form-select" id="session-duration">
              <option value="25">25 min (Pomodoro)</option>
              <option value="45" selected>45 min</option>
              <option value="60">60 min</option>
              <option value="90">90 min</option>
            </select>
          </div>
        </div>

        <button class="btn btn-primary w-full" id="generate-plan-btn" onclick="generatePlan()">
          📅 Generate Study Plan
        </button>
      </div>

      <!-- Generated Plan -->
      <div id="plan-output" style="display:none;"></div>

    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script src="/js/planner.js"></script>
</body>
</html>
